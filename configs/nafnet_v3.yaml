# NAFNet v3 experiment configuration

model:
  name: NAFNet-v3
  width: 32
  scale_factor: 2
  in_channels: 1
  out_channels: 1

  encoder_blocks:
    - 2
    - 2
    - 4
    - 8

  middle_blocks: 12

  decoder_blocks:
    - 2
    - 2
    - 2
    - 2

training:
  iterations: 100000
  patch_size_lr: 96
  batch_size: 8

  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0

  betas:
    - 0.9
    - 0.9

  scheduler: CosineAnnealingLR
  eta_min: 0.0000001

  gradient_clip_norm: 1.0
  mixed_precision: true

loss:
  type: combined
  l1_weight: 1.0
  gradient_weight: 0.1
  fft_weight: 0.1

dataset:
  format: npy
  input: NoisyLR
  target: GT

  supported_lr_sizes:
    - 64
    - 128

  scale_factor: 2

  validation_split: 0.03
  split_unit: clean_image

inference:
  tlc: true
  train_patch_size: 96

  ensemble:
    enabled: true
    rotations: 4
    flips: 2

evaluation:
  metrics:
    - PSNR
    - SSIM
    - LPIPS

results:
  nafnet_v3_psnr_db: 29.0
  bilinear_baseline_psnr_db: 26.0
  improvement_db: 3.0
